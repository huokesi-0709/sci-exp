agent_rules: AGENTS.md

status_semantics:
  completed: 已有可定位证据并满足对应冻结门槛
  in_progress: 已完成部分门槛，但阶段尚未通过
  waiting_hardware: 继续工作需要已下单但尚未到货的硬件
  formal_blocked: 不允许产生或宣称正式论文级结果
  dry_run_only: 只允许准备、测试或模拟，不计入正式证据

global_rules:
  - 先读取本账本，再规划实验；不得从E0自动重新开始
  - 已完成门槛除非设备、固件、接线或协议改变，否则不得自动重跑
  - 新实验不得覆盖旧原始文件，必须使用新的session和run ID
  - E0正式通过前，所有要求有效物理能耗的正式E1至E8运行停止
  - dry-run必须记录formal_evidence为false
  - 每次实验后更新账本、实验日志、证据哈希和异常记录

